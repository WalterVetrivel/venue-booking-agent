services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: venue_dev_pw
      POSTGRES_DB: venue_booking
    ports:
      - "5432:5432"
    volumes:
      # A Docker-managed volume: Postgres often fails to start with its data in a plain Windows folder.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venue_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
