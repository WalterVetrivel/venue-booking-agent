name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue_dev_pw
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://venue:venue_dev_pw@localhost:5432/venue_test
      DATABASE_URL: postgresql+psycopg://venue:venue_dev_pw@localhost:5432/venue_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -v
